services:
  - type: web
    name: college-final-project-backend
    env: node
    plan: starter
    buildCommand: "cd backend && npm ci && npm run build"
    startCommand: "cd backend && npm start"
    autoDeploy: true

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: HOST
        value: 0.0.0.0

      # Database: external Neon Postgres. Set the pooled URL manually in the
      # Render dashboard (Environment). Never commit it here.
      - key: DATABASE_URL
        sync: false

      # JWT Secrets
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      # CORS (includes all deployment URLs)
      - key: CORS_ORIGIN
        value: "https://frontend-ae3v.onrender.com,https://college-final-project.vercel.app,http://localhost:5173"

    # Health check
    healthCheckPath: /health
    preDeployCommand: "cd backend && npm run migrate"

    # Region
    region: singapore
