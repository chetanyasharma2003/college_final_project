services:
  - type: web
    name: college-final-project-backend
    env: node
    plan: starter
    buildCommand: "cd backend && npm install && npm run build"
    startCommand: "cd backend && npm start"
    autoDeploy: true

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: HOST
        value: 0.0.0.0

      # Database (will be set in Render dashboard)
      - key: DATABASE_URL
        fromDatabase:
          name: college-final-project-db
          property: connectionString

      # Redis (will be set in Render dashboard)
      - key: REDIS_URL
        fromDatabase:
          name: college-final-project-redis
          property: connectionString

      # JWT Secrets
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      # CORS
      - key: CORS_ORIGIN
        value: "https://college-final-project.vercel.app,http://localhost:5173"

    # Health check
    healthCheckPath: /health
    preDeployCommand: "cd backend && npx prisma migrate deploy"

    # Region
    region: singapore

databases:
  - name: college-final-project-db
    provider: postgresql
    plan: starter
    version: 16

  - name: college-final-project-redis
    provider: redis
    plan: starter
    region: singapore
