version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gov-schemes-db
    environment:
      POSTGRES_USER: ${DB_USER:-govschemes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: ${DB_NAME:-gov_schemes}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-govschemes}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gov-schemes-network
    restart: unless-stopped

  # Redis Cache (Cineworld-style optimization)
  redis:
    image: redis:7-alpine
    container_name: gov-schemes-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gov-schemes-network
    restart: unless-stopped

  # Backend API (Production-grade setup)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gov-schemes-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-govschemes}:${DB_PASSWORD:-devpassword}@postgres:5432/${DB_NAME:-gov_schemes}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-MyJWTSecretABC12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-MyRefreshSecretXYZ789}
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,https://frontend-ae3v.onrender.com
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - gov-schemes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001/api/v1
    container_name: gov-schemes-ui
    environment:
      VITE_API_URL: http://localhost:5001/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - gov-schemes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  gov-schemes-network:
    driver: bridge
